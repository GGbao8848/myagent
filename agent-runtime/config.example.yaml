# AgentRuntime 配置模板
# 使用方法：复制本文件为 config.yaml 后按需修改

server:
  # MCP 服务监听地址（强烈建议保持 127.0.0.1，防止局域网其他机器访问）
  host: 127.0.0.1
  # MCP 服务监听端口
  port: 18544
  # MCP 端点路径
  path: /mcp

security:
  # Agent 可访问的本地目录白名单（绝对路径）
  # 文件读写/列目录只能在这些目录内进行，超出范围会被拒绝
  allowed_dirs:
    - C:\Users\你的用户名\agent-workspace
  # 允许执行的命令白名单（仅命令名，不含参数）
  # 不在白名单内的命令会被拒绝
  allowed_commands:
    - python
    - python3
    - node
    - npm
    - git
    - pip
    - dir
    - ls
    - where
    - echo
    - type
    - copy
    - move
    - mkdir
    - rmdir
  # 单次命令执行超时（秒）
  exec_timeout_seconds: 30
  # 单次读取文件的最大字节数
  max_file_size_bytes: 1048576

logging:
  # 审计日志目录（安装后建议指向 C:\ProgramData\AgentRuntime\logs）
  log_dir: ./logs
  # 审计日志文件名
  audit_file: audit.log
  # 单个日志文件最大字节数（超过则滚动）
  max_bytes: 10485760
  # 保留的滚动日志文件数
  backup_count: 5
