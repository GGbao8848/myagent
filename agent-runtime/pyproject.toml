[project]
name = "agent-runtime"
version = "0.1.0"
description = "Windows 本地 Agent Runtime：通过 MCP 让 AI Agent 安全调用本机 Shell/Python/文件能力"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-runtime = "agent_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]
